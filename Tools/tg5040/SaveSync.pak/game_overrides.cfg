# ==============================================================================
# SaveSync Per-Game Filename Override Rules
# ==============================================================================
# Use this file when a specific game ROM has a different filename on your
# TrimUI Brick (NextUI) vs your RG28XX (Knulli).
#
# Format (Pipe-delimited, 4 columns):
#   NEXTUI_FOLDER | KNULLI_FOLDER | NEXTUI_EXACT_SAVE_FILENAME | KNULLI_EXACT_SAVE_FILENAME
#
# Rules defined here take highest priority over pattern mappings in mappings.cfg.
#
# Examples (uncomment to use):
# GBA | gba  | Pokemon - Emerald Version (USA, Europe).gba.sav | Pokemon Emerald (U).srm
# SFC | snes | Chrono Trigger (USA).sfc.sav                    | Chrono Trigger.srm
# PS  | psx  | Final Fantasy VII (USA).m3u.sav                 | Final Fantasy VII (USA) (Disc 1).srm
# ==============================================================================
