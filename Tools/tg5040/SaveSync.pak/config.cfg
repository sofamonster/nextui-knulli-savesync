# ==============================================================================
# SaveSync Configuration (TrimUI Brick / NextUI <-> Anbernic RG28XX / Knulli)
# ==============================================================================

# --- 1. SSH Connection Settings (RG28XX running Knulli) ---
# You can use the IP address (e.g., 192.168.1.50) or mDNS hostname (KNULLI.local)
SSH_HOST="KNULLI.local"
SSH_PORT="22"
SSH_USER="root"

# Default Knulli/Batocera root password is "linux".
# Used to automatically provision SSH key authentication on first run (or as fallback if sshpass is present).
SSH_PASSWORD="linux"

# Path to the SSH private key stored on the TrimUI SD card
# Leave empty to default to: <SaveSync.pak>/.ssh/id_save_sync
SSH_KEY_PATH=""

# Connection timeout in seconds
SSH_TIMEOUT="8"

# --- 2. Paths & Directories ---
# Local NextUI Saves root directory.
# Leave empty to auto-detect ($SDCARD_PATH/Saves or /mnt/SDCARD/Saves)
LOCAL_SAVES_ROOT=""

# Remote Knulli Saves root directory on the RG28XX
REMOTE_SAVES_ROOT="/userdata/saves"

# Local directory where compressed rolling backups are stored
# Leave empty to default to: $SDCARD_PATH/Backups/SaveSync
BACKUP_DIR=""

# --- 3. Sync, UI & Backup Behavior ---
# Startup behavior when launching SaveSync from NextUI Tools menu:
#   "menu" = Open the interactive SaveSync UI Menu (Sync Now, Edit IP/User/Password, etc.)
#   "auto" = Immediately synchronize saves on launch (only opens UI menu if connection fails)
STARTUP_MODE="menu"

# Number of compressed backups (.tar.gz) to keep for both local and remote saves
BACKUP_KEEP_COUNT="3"

# Whether to back up remote Knulli saves in addition to local NextUI saves before syncing
# "true" = creates both local_<timestamp>.tar.gz and remote_<timestamp>.tar.gz (keeps last 3 of each)
# "false" = backs up local NextUI saves only
BACKUP_REMOTE="true"

# Set to "true" to perform a simulation without overwriting any actual save files
DRY_RUN="false"

# Allowed real in-game save extensions (excludes save states like .state, .st0, .auto, .png)
# Space-separated list of extensions (without leading dot)
ALLOWED_SAVE_EXTS="sav srm rtc eep fla sra mcr mcd dsv"
