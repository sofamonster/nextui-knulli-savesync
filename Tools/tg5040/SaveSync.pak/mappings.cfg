# ==============================================================================
# SaveSync System, Folder & Filename Extension Mappings
# ==============================================================================
# Format (Pipe-delimited, 4 columns):
#   NEXTUI_FOLDER | KNULLI_FOLDER | NEXTUI_SAVE_SUFFIX | KNULLI_SAVE_SUFFIX
#
# How suffix translation works:
#   - NextUI (MinUI) by default includes the ROM extension in the save filename:
#       e.g., "Pokemon Emerald.gba.sav"  (NEXTUI_SAVE_SUFFIX = .gba.sav)
#   - Knulli (RetroArch) strips the ROM extension and uses .srm (or .sav):
#       e.g., "Pokemon Emerald.srm"      (KNULLI_SAVE_SUFFIX = .srm)
#
#   When syncing NextUI <-> Knulli, SaveSync matches the base game name
#   ("Pokemon Emerald") and automatically converts between NEXTUI_SAVE_SUFFIX
#   and KNULLI_SAVE_SUFFIX!
#
#   Note: If a system can have multiple ROM extensions on NextUI (e.g., .gb.sav and
#   .gbc.sav mapping to the same Knulli folder, or .chd.srm / .cue.srm / .pbp.srm),
#   simply add one line per suffix pair.
#
#   If you configured NextUI to use standard RetroArch save names without ROM
#   extensions, or want 1:1 filename syncing without renaming extensions, set
#   both suffixes to the same value (e.g., ".srm | .srm") or "* | *".
# ==============================================================================

